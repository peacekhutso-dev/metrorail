[project]
name = "metrorail-trips"
version = "0.1.0"
description = "Trips service: a commuter's saved trips (name, stations, days, usual train, alert settings)."
requires-python = ">=3.12"
dependencies = ["metrorail-common"]

[tool.uv.sources]
metrorail-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrorail_trips"]
