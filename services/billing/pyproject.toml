[project]
name = "metrorail-billing"
version = "0.1.0"
description = "Billing service: card payments through Pay@ (card only), 3-D Secure, saved cards (tokens), receipts."
requires-python = ">=3.12"
dependencies = ["metrorail-common"]

[tool.uv.sources]
metrorail-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrorail_billing"]
