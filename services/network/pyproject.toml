[project]
name = "metrorail-network"
version = "0.1.0"
description = "Network service: stations, lines, timetables and departure boards."
requires-python = ">=3.12"
dependencies = ["metrorail-common"]

[tool.uv.sources]
metrorail-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrorail_network"]
