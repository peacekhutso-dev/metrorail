[project]
name = "metrorail-tracking"
version = "0.1.0"
description = "Tracking service: live train positions, crowd reports, moving/held/stopped detection, delays."
requires-python = ">=3.12"
dependencies = ["metrorail-common"]

[tool.uv.sources]
metrorail-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrorail_tracking"]
