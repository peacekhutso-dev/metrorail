[project]
name = "metrorail-eta"
version = "0.1.0"
description = "ETA service: predicted arrival times (with a likely range) for every remaining stop."
requires-python = ">=3.12"
dependencies = ["metrorail-common"]

[project.optional-dependencies]
# The trained model. Not needed for the baseline predictor or tests.
ml = ["lightgbm>=4.5", "pandas>=2.2", "mlflow>=2.17"]

[tool.uv.sources]
metrorail-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrorail_eta"]
