[project]
name = "metrorail-notifications"
version = "0.1.0"
description = "Notifications service: in-app alerts for saved trips (delays, held/stopped trains, leave-now). SMS/email plans later."
requires-python = ">=3.12"
dependencies = ["metrorail-common"]

[tool.uv.sources]
metrorail-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrorail_notifications"]
