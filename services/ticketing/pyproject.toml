[project]
name = "metrorail-ticketing"
version = "0.1.0"
description = "Ticketing service: products, purchases, signed tickets, sealed rotating QR, validation and trip counting."
requires-python = ">=3.12"
dependencies = ["metrorail-common"]

[tool.uv.sources]
metrorail-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrorail_ticketing"]
