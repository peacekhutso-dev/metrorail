[project]
name = "metrorail-realtime"
version = "0.1.0"
description = "Realtime service: forwards live train updates and alerts to phones via Centrifugo (SSE), issues connection tokens."
requires-python = ">=3.12"
dependencies = ["metrorail-common"]

[tool.uv.sources]
metrorail-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrorail_realtime"]
