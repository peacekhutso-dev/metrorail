[project]
name = "metrorail-identity"
version = "0.1.0"
description = "Identity service: passwordless login (6-digit code by SMS or email), tokens, consents, POPIA export/delete."
requires-python = ">=3.12"
dependencies = ["metrorail-common"]

[tool.uv.sources]
metrorail-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrorail_identity"]
