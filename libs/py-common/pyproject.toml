[project]
name = "metrorail-common"
version = "0.1.0"
description = "Shared service template for MetroRail FastAPI services: config, app factory, DB, events, auth, logging."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "nats-py>=2.9",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrorail_common"]
