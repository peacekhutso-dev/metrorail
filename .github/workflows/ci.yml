name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet build -warnaserror
      - run: dotnet test --no-build
      - name: Contracts are up to date
        run: |
          dotnet run --project tools/MetroRail.Tools --no-build -- openapi
          git diff --exit-code contracts/openapi || (echo "Run 'make contracts' and commit" && exit 1)

  customer-app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/customer } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/customer/package-lock.json }
      - run: npm ci
      - run: npm run build

  qr-interop:
    needs: [services, customer-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: (cd apps/customer && npm ci) && dotnet build tools/MetroRail.Tools
      - run: dotnet run --project tools/MetroRail.Tools --no-build -- qr-interop

  images:
    needs: services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [Network, Tracking, Eta, Realtime, Identity, Trips, Notifications, Ticketing, Billing]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f infra/docker/service.Dockerfile --build-arg SERVICE=${{ matrix.service }} -t metrorail/service:${{ matrix.service }}-ci .
