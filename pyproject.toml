[project]
name = "metrorail-workspace"
version = "0.1.0"
description = "MetroRail monorepo (uv workspace root). Not a package itself."
requires-python = ">=3.12"
dependencies = [
  "metrorail-common",
  "metrorail-network",
  "metrorail-tracking",
  "metrorail-eta",
  "metrorail-identity",
  "metrorail-trips",
  "metrorail-notifications",
  "metrorail-ticketing",
  "metrorail-billing",
  "metrorail-realtime",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/py-common", "services/*"]

[tool.uv.sources]
metrorail-common = { workspace = true }
metrorail-network = { workspace = true }
metrorail-tracking = { workspace = true }
metrorail-eta = { workspace = true }
metrorail-identity = { workspace = true }
metrorail-trips = { workspace = true }
metrorail-notifications = { workspace = true }
metrorail-ticketing = { workspace = true }
metrorail-billing = { workspace = true }
metrorail-realtime = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
known-first-party = ["metrorail_*"]
